name: 국토부 실거래 일별 수집

on:
  schedule:
    # 매일 새벽 3시 KST (= UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 일별 수집 실행 (전월+당월)
        run: npx tsx scripts/collect-daily.ts
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # 신규 단지(apt_coords 미적재) 좌표 자동 백필
      - name: 신규 아파트 단지 좌표 지오코딩
        run: npx tsx scripts/geocode-apt.ts
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEOCODE_LIMIT: '500'   # 일별 신규 단지는 보통 수십 건 수준

      # 시세 동향 페이지가 읽는 월별 통계(sgg/umd_monthly_stats) 갱신.
      # 예전엔 수동 스크립트뿐이라 2026-03 에서 멈춰 있었다. 멈춘 달부터 이번 달까지 알아서 따라잡는다.
      # 수집이 중간에 끊긴 날에도 들어온 만큼은 반영되게 always() 로 둔다.
      - name: 시세 동향 월별 통계 갱신
        if: always()
        run: npx tsx scripts/build-trend-stats.ts
        timeout-minutes: 30
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: 실패 로그 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git diff --staged --quiet || git commit -m "logs: 일별 수집 실패 목록 $(date '+%Y-%m-%d')"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
